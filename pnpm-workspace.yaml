packages:
  - apps/*
  - packages/*

# Install scripts are a common way for malicious packages to get in, so they're
# blocked unless a package is listed here.
onlyBuiltDependencies:
  - esbuild

# Blocked on purpose. They build optional native speedups we don't need
# (Testcontainers, tests only; msgpackr via BullMQ, which falls back to plain JS).
# Listing them keeps installs quiet.
ignoredBuiltDependencies:
  - cpu-features
  - msgpackr-extract
  - protobufjs
  - ssh2

# Don't install anything published in the last 3 days. Hijacked releases usually
# get caught and pulled within that window.
minimumReleaseAge: 4320
