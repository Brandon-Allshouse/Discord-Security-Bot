name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow token can only read the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs.
      # Dependabot bumps the SHA and the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build first: type-aware lint resolves @equinox/* imports through each package's dist/*.d.ts.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # Integration tests start Postgres and Redis with Testcontainers (Docker is on ubuntu runners).
      - run: pnpm test
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f apps/api/Dockerfile -t equinox-api:ci .
      - run: docker build -f apps/bot/Dockerfile -t equinox-bot:ci .
      - run: docker build -f apps/dashboard/Dockerfile -t equinox-dashboard:ci .
      - run: docker build -f apps/worker/Dockerfile -t equinox-worker:ci .
