name: equinox

# Local development stack. Postgres and Redis listen on 127.0.0.1 only,
# and both require passwords from .env (never defaults).
#
# Data flow: browser -> dashboard (frontend) -> api (backend) -> postgres, redis, bot.
# The dashboard is only on the "frontend" network, so it can reach the API and nothing
# else: not Postgres, not Redis, not the bot. The API is on both networks and is not
# published outside Docker at all.
#
# Every service gets only the settings it uses, named one by one (never the whole .env).

networks:
  frontend:
  backend:

services:
  postgres:
    image: postgres:16-alpine
    networks: [backend]
    environment:
      POSTGRES_USER: equinox
      POSTGRES_DB: equinox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equinox -d equinox"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks: [backend]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    networks: [backend]
    # The bot token, and nothing it doesn't use (no OAuth secret, intel keys or API key).
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DEV_GUILD_ID: ${DEV_GUILD_ID:-}
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:-}
      DATABASE_URL: postgres://equinox:${POSTGRES_PASSWORD}@postgres:5432/equinox
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Lock the container down: read-only filesystem, no Linux capabilities, no privilege escalation.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # The backend for the dashboard. No "ports": only the dashboard (on the frontend network) can reach it.
    networks: [frontend, backend]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      API_SIGNING_KEY: ${API_SIGNING_KEY:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      INTERNAL_SIGNING_KEY: ${INTERNAL_SIGNING_KEY:-}
      DATABASE_URL: postgres://equinox:${POSTGRES_PASSWORD}@postgres:5432/equinox
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The bot runs the database migrations when it starts.
      bot:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    # The frontend: only on the frontend network, with only the API's address and signing key.
    # No database, Redis or Discord credentials at all.
    networks: [frontend]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:3000}
      API_URL: http://api:4000
      API_SIGNING_KEY: ${API_SIGNING_KEY:-}
      # Listen on every interface inside the container; the port below is only published on 127.0.0.1.
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    networks: [backend]
    # This container visits links strangers post, so it never sees the Discord token or the OAuth secret.
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://equinox:${POSTGRES_PASSWORD}@postgres:5432/equinox
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      VT_API_KEY: ${VT_API_KEY:-}
      VT_TIER: ${VT_TIER:-public}
      VT_DAILY_BUDGET: ${VT_DAILY_BUDGET:-500}
      VT_PER_MINUTE: ${VT_PER_MINUTE:-4}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # The bot runs the database migrations when it starts.
      bot:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
